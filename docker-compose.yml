services:
  shortly-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortly-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Overrides appsettings.json's relative "Data Source=database.db" so the
      # SQLite file is written inside the mounted volume instead of the
      # container's ephemeral filesystem.
      ConnectionStrings__AppDbContext: "Data Source=/app/data/database.db"
      # "shortly-cache" resolves via Docker's internal DNS to the Redis
      # container below — no IP address needed, just the service name.
      ConnectionStrings__Redis: "shortly-cache:6379"
      Seed__AdminPassword: "${ADMIN_PASSWORD:-admin123}"
    volumes:
      # Named volume: persists the SQLite database file across
      # container restarts/recreations.
      - shortly-db-data:/app/data
    networks:
      - shortly-network
    depends_on:
      - shortly-cache
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Bonus: cache service for frequently accessed URLs. Used by LinkService.GetLink
  # (the method behind the redirect flow) with a cache-first strategy, and by
  # MemoryCacheTicketStore for cookie-based auth session storage.
  shortly-cache:
    image: redis:7-alpine
    container_name: shortly-cache
    restart: unless-stopped
    # No port published to the host — only shortly-web needs to reach it,
    # over the internal Docker network.
    networks:
      - shortly-network
    volumes:
      - shortly-cache-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # NOTE on "shortly-db": the current stack uses SQLite (an embedded,
  # file-based database, not a client/server engine), which the Lab 5
  # statement explicitly allows ("SQL Server, PostgreSQL, or SQLite
  # depending on the current stack"). SQLite has no server process to run
  # as its own container, so there is no separate "shortly-db" service here.
  # Its role is filled by the named volume "shortly-db-data" above, which
  # persists database.db independently of the shortly-web container's
  # lifecycle. See docs/docker.md for details.

networks:
  shortly-network:
    driver: bridge

volumes:
  shortly-db-data:
  shortly-cache-data: